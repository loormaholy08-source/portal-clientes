<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marcas con las que trabajamos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Móvil primero: una columna, tarjetas grandes, botones de dedo. El color de cada cliente entra por --pri y --acc */
:root{
  color-scheme:only light;
  --pri:#1F2D3D; --acc:#E8740C;
  --bg:#F4F5F6; --card:#FFFFFF; --ink:#16202A; --muted:#5B6773; --line:#E0E4E8; --soft:#EEF1F4;
  --ok:#1E8E4E; --okbg:#E3F4EA; --wait:#9A6400; --waitbg:#FFF2D6; --need:#C0392B; --needbg:#FDE7E4; --prep:#4A5866; --prepbg:#EEF1F4; --pub:#6A44A8; --pubbg:#EFE8FA;
  --wa:#1FA855;
  --fd:"Archivo","Arial Narrow",Arial,sans-serif; --fb:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--fb);-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.w{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* cabecera del cliente */
.hero{background:var(--pri);color:#fff}
.hero .ban{aspect-ratio:16/6;max-height:210px;width:100%;background:var(--pri) center/cover no-repeat}
.hero .w{max-width:1200px;padding-block:18px 24px;display:flex;flex-direction:column;gap:14px}
.hero .logo{height:76px;width:auto;align-self:flex-start}
.hero h1{font:900 clamp(28px,7vw,40px)/1.05 var(--fd);margin:0;text-wrap:balance}
.hero p{margin:0;font-size:18px;opacity:.95;max-width:46ch}

.back{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 4px;font-weight:700;text-decoration:none;color:var(--ink)}
.back span{font-size:24px;line-height:1}

h2{font:800 24px/1.15 var(--fd);margin:32px 0 6px}
.hint{color:var(--muted);margin:0 0 14px;font-size:16px}

/* tarjeta de pieza grande */
.cards{display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;display:block}
.card .im{aspect-ratio:4/5;background:var(--soft) center/cover;position:relative}
.card .im .fmt{position:absolute;left:12px;top:12px;background:rgb(0 0 0 / .62);color:#fff;font-weight:700;font-size:14px;padding:5px 10px;border-radius:8px}
.card .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.card .day{font-weight:700;color:var(--acc)}
.card b.t{font:800 21px/1.2 var(--fd)}
.card .go{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;font-size:18px;margin-top:4px}
@media (min-width:620px){.cards.two{display:grid;grid-template-columns:1fr 1fr}}

.st{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15px;padding:5px 12px;border-radius:999px;width:max-content;max-width:100%}
.st.ok{color:var(--ok);background:var(--okbg)} .st.wait{color:var(--wait);background:var(--waitbg)} .st.need{color:var(--need);background:var(--needbg)} .st.prep{color:var(--prep);background:var(--prepbg)} .st.pub{color:var(--pub);background:var(--pubbg)}

/* lo que necesito de ti */
.need{background:var(--card);border:2px solid var(--acc);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.need ol{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:10px}
.need li{padding-left:4px}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:12px;font-weight:700;font-size:18px;text-decoration:none;border:0;cursor:pointer;padding:0 18px;text-align:center}
.btn.wa{background:var(--wa);color:#fff}
.btn.line{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.pri{background:var(--pri);color:#fff}
.btns{display:flex;flex-direction:column;gap:10px}

/* mes como lista por semanas */
.week{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.week h3{margin:0;padding:12px 16px;font:800 17px/1.2 var(--fd);background:var(--soft)}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;text-decoration:none;border-top:1px solid var(--line);min-height:76px}
.row .th{width:60px;height:75px;border-radius:8px;background:var(--soft) center/cover;flex:none}
.row .tx{display:flex;flex-direction:column;gap:4px;min-width:0}
.row .tx b{font-size:16.5px;line-height:1.25}
.row .tx small{color:var(--muted);font-size:14.5px}
.weeks{display:flex;flex-direction:column;gap:14px}

/* pieza */
.big{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.big img{width:100%;max-height:72vh;object-fit:contain;margin:0 auto}
.big video{width:100%;max-height:78vh;display:block;background:#000}
.slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.slider::-webkit-scrollbar{display:none}
.slider img{flex:0 0 100%;scroll-snap-align:center;width:100%;max-height:72vh;object-fit:contain;background:var(--soft)}
.dots{display:flex;justify-content:center;gap:7px;padding:10px 0 2px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--acc)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.sw button{min-height:48px;min-width:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:22px;cursor:pointer}
.sw span{color:var(--muted);font-weight:600;font-size:15px}
.card .im .play{position:absolute;inset:auto 12px 12px auto;background:var(--acc);color:#fff;font-weight:800;font-size:15px;padding:8px 12px;border-radius:999px}
.card .im{background-position:center top}
.copy{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;white-space:pre-wrap;font-size:17px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.sticky{position:sticky;bottom:0;background:linear-gradient(180deg,rgb(244 245 246 / 0),var(--bg) 28%);padding:22px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:24px}

/* guía para grabar */
.rule{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rule i{font-style:normal;font:900 20px/1 var(--fd);color:var(--acc);min-width:22px}
.toma{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.toma .id{font:900 15px/1 var(--fd);color:#fff;background:var(--pri);padding:6px 9px;border-radius:7px;align-self:flex-start}
.toma q{font-size:19px;font-weight:700;quotes:"«" "»"}
.toma small{color:var(--muted);font-size:15px}
.toma label{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;cursor:pointer}
.toma input{width:24px;height:24px;accent-color:var(--ok)}
.kw{background:var(--card);border:2px dashed var(--acc);border-radius:14px;padding:14px 16px;margin-top:16px}
.kw b.w{font:900 22px/1 var(--fd);color:var(--acc);letter-spacing:.04em}
.tw{overflow-x:auto;margin-top:6px}
table.tm{border-collapse:collapse;width:100%;min-width:520px;background:var(--card);border-radius:12px;overflow:hidden;font-size:15.5px}
table.tm th,table.tm td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.tm th{background:var(--soft);font-weight:700}
table.tm td:first-child{white-space:nowrap;font-weight:700;color:var(--acc)}
.ej{display:grid;grid-template-columns:110px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.ej img{width:110px;aspect-ratio:9/16;object-fit:cover;border-radius:8px}

/* vista agencia */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.cli{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none}
.cli .cv{aspect-ratio:16/9;display:grid;place-items:center}
.cli .cv img{max-height:62%;width:auto}
.cli .bd{padding:12px 14px}
.agency{background:var(--waitbg);border-radius:12px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.agency b{font-weight:700}
.toggle{display:flex;align-items:center;gap:10px;min-height:48px;font-weight:700}
.toggle input{width:22px;height:22px}
/* portal del cliente: contenido a la izquierda, feed tipo Instagram a la derecha */
.lay{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:8px 40px}
.lay>.main{min-width:0}
.lay>.side{min-width:0}
@media (min-width:980px){.lay{grid-template-columns:minmax(0,1fr) 400px}.lay>.side{grid-column:2;grid-row:1/span 2}.lay>.side .phone{position:sticky;top:16px;margin-top:-90px}}
.phone{background:#FFFFFF;color:#0F1419;border:10px solid #10161D;border-radius:38px;padding:16px 12px 14px;box-shadow:0 18px 50px rgb(16 22 29 / .18);max-width:400px;margin:24px auto 0}
.ig{display:flex;gap:14px;align-items:center;padding:4px 4px 10px}
.ig .av{width:66px;height:66px;border-radius:50%;background:var(--pri);display:grid;place-items:center;overflow:hidden;flex:none;outline:3px solid var(--acc);outline-offset:2px}
.ig .av img{width:74%}
.ig b{display:block;font-size:16px}
.ig small{color:var(--muted);font-size:13.5px;line-height:1.3;display:block}
.ig .nums{display:flex;gap:6px;flex:1;justify-content:space-around;text-align:center;font-size:12.5px;line-height:1.2}
.ig .nums b{display:block;font-size:17px}
.igtop{font-weight:800;font-size:18px;text-align:center;padding:2px 0 10px}
.bio{font-size:13.5px;line-height:1.35;padding:0 4px 10px}
.igbtn{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 2px 10px}
.igbtn span{background:#EFEFEF;border-radius:8px;text-align:center;font-weight:700;font-size:13px;padding:7px 0}
.tabs{display:flex;justify-content:space-around;margin:0 -12px 2px;padding:6px 0;font-size:18px;color:#8E8E8E}
.tabs span.on{color:#0F1419;border-bottom:2px solid #0F1419;padding:0 24px 4px}
.tabs span.on{color:var(--ink)}
.feed{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0 -12px}
.feed button{all:unset;cursor:pointer;position:relative;aspect-ratio:4/5;background:var(--soft) center/cover;display:block}
.feed button:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
.feed .ic{position:absolute;top:6px;right:6px;color:#fff;font-size:15px;filter:drop-shadow(0 1px 2px rgb(0 0 0 / .6))}
.feed .tg{position:absolute;left:5px;bottom:5px;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:#FFFFFF;color:#0F1419}
.feed .tg.pub{background:var(--ok);color:#fff}
.feed .plan{opacity:.92}
.legend2{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:#6B7280;padding:10px 4px 0}
/* visor */
.vw{position:fixed;inset:0;z-index:50;background:rgb(10 14 18 / .92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
.vw .x{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));min-width:48px;min-height:48px;border-radius:50%;border:0;background:#fff;font-size:24px;cursor:pointer}
.vw .box{width:min(440px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px}
.vw video{width:100%;max-height:72vh;background:#000;border-radius:12px}
.vw .cap{color:#fff;font-weight:700;text-align:center}
.vw .slider img{max-height:70vh}
.vw .sw button{background:#fff}
.vw .sw span{color:#fff}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:var(--pri)}
.gate .bx{background:#fff;border-radius:18px;padding:26px 22px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
.gate img{height:96px;width:auto;margin:0 auto;background:var(--pri);border-radius:12px;padding:8px}
.gate h1{font:900 26px/1.1 var(--fd);margin:0}
.gate input{font:800 30px/1 var(--fd);letter-spacing:.4em;text-align:center;padding:14px 10px;border:2px solid var(--line);border-radius:12px;width:100%}
.gate .err{color:var(--need);font-weight:700;min-height:1.4em;margin:0}

/* ===== Portal de entrada (estilo violeta de Maholy, ref. Diginyze) ===== */
.vio{--v1:#2E2380;--v2:#5B3FD4;--v3:#8F6BF0;--v4:#E6C9F2;--vb:#6C47E8;--vt:#FFFFFF;
  min-height:100vh;color:var(--vt);position:relative;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 0%,#4A33B8 0%,rgb(74 51 184 / 0) 60%),linear-gradient(180deg,var(--v1) 0%,var(--v2) 34%,var(--v3) 62%,var(--v4) 100%)}
.vio::before{content:"";position:absolute;left:-12%;top:-18%;width:46vw;height:46vw;max-width:520px;max-height:520px;border-radius:50%;background:rgb(255 255 255 / .07)}
.vio .stars{position:absolute;inset:0;pointer-events:none;background-image:
  radial-gradient(2px 2px at 12% 22%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 78% 14%,#fff 50%,transparent 51%),
  radial-gradient(2px 2px at 88% 42%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 22% 58%,#fff 50%,transparent 51%),
  radial-gradient(2.5px 2.5px at 60% 30%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 42% 8%,#fff 50%,transparent 51%),
  radial-gradient(2px 2px at 94% 70%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 6% 80%,#fff 50%,transparent 51%);opacity:.85}
.vio .in{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(34px + env(safe-area-inset-top,0px)) 60px;display:flex;flex-direction:column;align-items:center;text-align:center}
.vio .marca{font:800 20px/1 var(--fd);letter-spacing:.02em;display:flex;align-items:center;gap:10px;opacity:.96}
.vio .marca i{display:inline-grid;grid-template-columns:repeat(3,6px);gap:3px}
.vio .marca i b{width:6px;height:6px;border-radius:2px;background:#fff}
.vio .marca i b:nth-child(2n){opacity:.55}
.vio h1{font:900 clamp(34px,7vw,64px)/1.03 var(--fd);margin:22px 0 10px;text-wrap:balance;letter-spacing:-.01em}
.vio .sub{font-size:clamp(18px,2.6vw,24px);margin:0;max-width:36ch;opacity:.95}
.vio .row3{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:34px;margin-top:46px;perspective:1200px;width:100%}
.fc{width:260px;max-width:100%;background:rgb(255 255 255 / .9);color:#1D1640;border-radius:18px;padding:18px 18px 16px;text-decoration:none;text-align:left;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 0 0 1px rgb(255 255 255 / .7),0 0 46px rgb(255 255 255 / .55),0 24px 50px rgb(40 20 120 / .28);transition:transform .25s}
.fc:nth-child(3n+1){transform:rotateY(14deg) rotateZ(-2deg) translateY(18px)}
.fc:nth-child(3n+2){transform:translateY(46px)}
.fc:nth-child(3n){transform:rotateY(-14deg) rotateZ(2deg) translateY(10px)}
.fc:hover,.fc:focus-visible{transform:translateY(0) scale(1.03)}
.fc .lg{aspect-ratio:4/3;border-radius:12px;display:grid;place-items:center}
.fc .lg img{max-height:70%;max-width:80%;width:auto}
.fc .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fc b{font:800 19px/1.15 var(--fd)}
.fc small{color:#5B5480;font-size:14.5px;line-height:1.3;display:block;margin-top:4px}
.fc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.fc .ft span{font-weight:700;font-size:14.5px;color:#4B3BB0}
.fc .go{width:48px;height:48px;border-radius:12px;background:var(--vb);color:#fff!important;display:grid;place-items:center;font:900 24px/1 var(--fb);box-shadow:0 6px 16px rgb(108 71 232 / .45)}
.fc.prox{background:rgb(255 255 255 / .28);color:#fff;border:2px dashed rgb(255 255 255 / .7);box-shadow:none;justify-content:center;align-items:center;min-height:250px;text-align:center}
.fc.prox small{color:#fff;opacity:.9}
.vio .pie{margin-top:80px;color:#2E2380;font-weight:600;font-size:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.vio .pie .btn{background:var(--vb);color:#fff;border-radius:14px;min-height:54px;padding:0 22px}
@media (max-width:640px){.fc .lg{aspect-ratio:16/8}.fc{width:min(320px,100%)}.fc:nth-child(n){transform:rotateZ(-1.5deg)}.fc:nth-child(2n){transform:rotateZ(1.5deg)}.vio .row3{gap:22px;margin-top:34px}}
.gate.vio{display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.gate.vio .bx{position:relative;z-index:1;background:rgb(255 255 255 / .92);color:#1D1640;box-shadow:0 0 50px rgb(255 255 255 / .55),0 24px 50px rgb(40 20 120 / .3)}
.gate.vio .bx .btn{background:#6C47E8;color:#fff}
.gate.vio .bx input{border-color:#D8CCF7}
.gate.vio .bx input:focus{outline:3px solid #8F6BF0;border-color:#8F6BF0}
@media (prefers-reduced-motion:reduce){.fc{transition:none}}

.foot{color:var(--muted);font-size:14px;text-align:center;padding:30px 0 40px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<!-- datos de cada cliente: los archivos los edita el Claude de cada cliente -->

const lunes = d => { const x=new Date(d); x.setHours(12,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
const key = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

function setColors(c){ const r=document.documentElement.style; r.setProperty("--pri",c?.colores?.primario||"#1F2D3D"); r.setProperty("--acc",c?.colores?.acento||"#E8740C"); document.title = c ? c.nombre+" · Tu contenido" : "Portales del cliente"; }

function estaSemana(m){
  const hoy=new Date(), a=lunes(hoy), b=new Date(a); b.setDate(a.getDate()+6);
  let s=m.piezas.filter(p=>p.d>=key(a)&&p.d<=key(b));
  if(!s.length) s=m.piezas.filter(p=>p.d>=key(hoy)).slice(0,3);
  if(!s.length) s=m.piezas.slice(-3);
  return s;
}
const agencyBox = p => agencia && p.interno ? `<div class="agency"><b>Solo para Maholy</b>${Object.entries(p.interno).filter(([k,v])=>v!==""&&v!=null).map(([k,v])=>`<div><b>${esc(k)}:</b> ${esc(v)}</div>`).join("")}</div>` : "";

}

function feedItems(c,m){
  const pub=(c.publicados||[]).map((p,i)=>({...p,_pub:true,_k:"pub-"+i}));
  const plan=m.piezas.map(p=>({...p,_pub:false,_k:"p-"+p.n}));
  return [...pub,...plan];
}

function abrirVisor(c,p){
  const v=document.createElement("div"); v.className="vw"; v.setAttribute("role","dialog");
  let body;
  if(p.video) body=`<video src="${src(p.video)}" poster="${src(p.img)}" controls playsinline autoplay></video>`;
  else if(p.laminas&&p.laminas.length) body=`<div class="big"><div class="slider" id="sl">${p.laminas.map((x,i)=>`<img src="${src(x)}" alt="Imagen ${i+1}">`).join("")}</div></div>${p.laminas.length>1?`<div class="sw"><button type="button" id="pv">←</button><span id="ct">1 de ${p.laminas.length}</span><button type="button" id="nx">→</button></div>`:""}`;
  else body=`<div class="big"><img src="${src(p.img)}" alt=""></div>`;
  v.innerHTML=`<button class="x" type="button" aria-label="Cerrar">✕</button><div class="box">${body}<div class="cap">${esc(p.t)}</div>
    ${!p._pub&&p.n!=null?`<a class="btn wa" href="#${c.id}-pieza-${p.n}">Ver detalles y aprobar</a>`:""}</div>`;
  const close=()=>{v.querySelector("video")?.pause();v.remove();document.removeEventListener("keydown",esk)};
  const esk=e=>{if(e.key==="Escape")close()};
  v.querySelector(".x").onclick=close; v.addEventListener("click",e=>{if(e.target===v)close()}); document.addEventListener("keydown",esk);
  v.querySelectorAll("a").forEach(a=>a.addEventListener("click",close));
  document.body.appendChild(v); sliderInit(); v.querySelector(".x").focus();
}

function sliderInit(){
  const sl=document.getElementById("sl"); if(!sl) return; const n=sl.children.length;
  const go=i=>sl.scrollTo({left:sl.clientWidth*Math.max(0,Math.min(n-1,i)),behavior:"smooth"});
  const cur=()=>Math.round(sl.scrollLeft/sl.clientWidth);
  sl.addEventListener("scroll",()=>{const i=cur();const ct=document.getElementById("ct");if(ct)ct.textContent=`${i+1} de ${n} · desliza con el dedo`;document.querySelectorAll("#dt i").forEach((d,k)=>d.classList.toggle("on",k===i));},{passive:true});
  const pv=document.getElementById("pv"),nx=document.getElementById("nx");
  pv&&pv.addEventListener("click",()=>go(cur()-1)); nx&&nx.addEventListener("click",()=>go(cur()+1));
}

const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function abrirMarca(m, codigo){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(codigo), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(m.sal), iterations:m.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const r = await fetch(m.archivo); const buf = await r.arrayBuffer();
  const plano = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(m.iv)}, key, buf);  // falla si el código no es
  const d = JSON.parse(new TextDecoder().decode(plano));
  C[m.id] = d.cliente; IMG = Object.assign({}, IMG||{}, d.imgs||{});
}

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  const ids=Object.keys(C);
  if(MODO && !h) { vCliente(C[MODO]); return scrollTo(0,0); }
  if(PORTAL){ const id=(window.MARCAS||[]).map(x=>x.id).find(i=>h===i||h.startsWith(i+"-")); if(id && !C[id]){ vGate(id); return scrollTo(0,0); } }
  let m=h.match(/^(.+)-pieza-(\d+)$/); if(m&&C[m[1]]&&(!MODO||m[1]===MODO)){vPieza(C[m[1]],+m[2]);return scrollTo(0,0);}
  m=h.match(/^(.+)-grabar$/); if(m&&C[m[1]]&&(!MODO||m[1]===MODO)){vGrabar(C[m[1]]);return scrollTo(0,0);}
  if(C[h]&&(!MODO||h===MODO)){vCliente(C[h]);return scrollTo(0,0);}
  if(MODO){vCliente(C[MODO]);return scrollTo(0,0);}
  vInicio(); scrollTo(0,0);
}
const app=document.getElementById("app");
// código de acceso por cliente (barrera ligera: no es una contraseña fuerte)
const huella = s => { let x=2166136261; for(const ch of s){ x^=ch.codePointAt(0); x=Math.imul(x,16777619)>>>0; } return x.toString(16); };
function arrancar(){ addEventListener("hashchange",route); route(); }
if(MODO && window.PIN_HUELLA){
  let ok=false; try{ ok = localStorage.getItem("acceso-"+MODO)===window.PIN_HUELLA; }catch(e){}
  if(ok) arrancar(); else {
    const c=C[MODO]; setColors(c);
    app.innerHTML=`<div class="gate"><form class="bx" id="gf"><img src="${src(c.logo)}" alt=""><h1>Hola ${esc(c.persona||c.contacto?.trato||"")} 👋</h1>
      <p style="margin:0">Escribe tu código de 4 números para ver tu contenido.</p>
      <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" aria-label="Código de 4 números">
      <p class="err" id="er"></p><button class="btn pri" type="submit">Entrar</button>
      <p class="hint" style="margin:0">¿No tienes el código? Pídeselo a Maholy por WhatsApp.</p></form></div>`;
    const inp=document.getElementById("pin"); inp.focus();
    document.getElementById("gf").addEventListener("submit",e=>{e.preventDefault();
      if(huella(MODO+":"+inp.value.trim())===window.PIN_HUELLA){ try{localStorage.setItem("acceso-"+MODO,window.PIN_HUELLA)}catch(e){} arrancar(); }
      else { document.getElementById("er").textContent="Ese código no es. Revisa y vuelve a intentar."; inp.value=""; inp.focus(); } });
  }
} else arrancar();
</script>
